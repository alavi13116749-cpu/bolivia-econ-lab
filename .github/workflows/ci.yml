name: CI y GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos por defecto; cada job pide sólo lo que usa.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write # configure-pages consulta la configuración del sitio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Falla aquí, con un mensaje legible, si GitHub Pages no está activado
      # (Settings → Pages → Source: GitHub Actions).
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write # publicar en GitHub Pages
      id-token: write # verificar el origen del despliegue (OIDC)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # No cancelar un despliegue a medias; los despliegues se encolan.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
